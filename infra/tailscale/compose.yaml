services:
  tailscale:
    image: local/tailscale-lfs:1.104.7-arm64
    pull_policy: never
    container_name: tailscale-lfs
    hostname: ugreen-lfs
    restart: unless-stopped
    volumes:
      - ./state:/var/lib/tailscale
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
