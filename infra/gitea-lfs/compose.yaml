services:
  gitea:
    image: docker.gitea.com/gitea:28.3.0
    container_name: gitea-lfs
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "10"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__server__DOMAIN: 192.168.1.7
      GITEA__server__ROOT_URL: http://192.168.1.7:3000/
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__DISABLE_SSH: "true"
      GITEA__server__LFS_START_SERVER: "true"
      GITEA__lfs__PATH: /data/git/lfs
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__repository__DEFAULT_PRIVATE: private
      GITEA__repository__FORCE_PRIVATE: "true"
      GITEA__actions__ENABLED: "false"
    ports:
      - "192.168.1.7:3000:3000"
    volumes:
      - ./data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
